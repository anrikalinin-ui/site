{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="nav">
        <a class="nav-logo" href="{% url 'resume:home' %}">{% block logoname %}{% endblock %}</a>
        <div class="nav-links">
            <a href="{% url 'resume:home' %}">Резюме</a>
            <a href="{% url 'blog:post_list' %}">Блог</a>
            <a href="{% url 'contact:contact' %}">Связаться</a>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <footer>
        <div class="wrap">
            © {% now "Y" %} — сделано на Django
        </div>
    </footer>
</body>
</html>
