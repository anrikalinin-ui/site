{% extends 'base.html' %}

{% block logoname %}БЕ{% endblock %}
{% block title %}Связаться{% endblock %}

{% block content %}
<div class="page wrap">
    <div class="glass form" style="padding: clamp(24px,4vw,40px);">
        <h1 class="page-title" style="margin-bottom:8px;">Связаться со мной</h1>
        <p style="color: var(--muted); margin-bottom:24px;">Оставьте сообщение — оно придёт прямо мне.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-grad" type="submit">Отправить</button>
        </form>
    </div>
</div>
{% endblock %}
