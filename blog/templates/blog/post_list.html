{% extends 'base.html' %}

{% block logoname %}БЕ{% endblock %}
{% block title %}Блог{% endblock %}

{% block content %}
<div class="page wrap">
    <h1 class="page-title">Блог</h1>
    <div class="post-list">
        {% for post in posts %}
        <a class="post-card" href="{% url 'blog:post_detail' post.pk %}">
            <div class="pc-date">{{ post.created|date:"d.m.Y" }}</div>
            <h2>{{ post.title }}</h2>
            <p>{{ post.body|truncatewords:40 }}</p>
        </a>
        {% empty %}
        <p style="color: var(--muted);">Пока нет постов.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
